<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Cadastro</title>
    <link rel="stylesheet" href="../css/style-cadastro.css">
</head>

<body>

    <div class="header">
        <img class="icone-carrinho" src="../img/carrinho.png" alt="Ícone de carrinho de compras">
        <h1 class="title">Flow<span style="color: #6AAE48">market</span></h1>
    </div>

    <form action="/cadastrar-usuario" onsubmit="cadastrarUsuario(event)" class="cad-container">

        <div class="form-header">
            <h1 class="title">Criar Conta</h1>
            <p class="form-text">
                Cadastro com dados do usuário, leva menos de um minuto.
            </p>
        </div>

        <div class="campo">
            <label for="ipt_nome">Nome Completo</label>
            <input type="text" id="ipt_nome" class="form-input" placeholder="Ex: João da Silva" oninput="validarNome()"
                required>
            <p id="msg_nome" class="msg-validacao"></p>
        </div>

        <div class="campo">
            <label for="ipt_email">E-mail Corporativo</label>
            <input type="email" id="ipt_email" class="form-input" placeholder="Ex: nome@empresa.com.br" oninput="validarEmail()" required>
            <p id="msg_email" class="msg-validacao"></p>
        </div>

        <div class="campo">
            <label for="ipt_senha">Senha</label>
            <div class="campo-senha"><input type="password" id="ipt_senha" class="form-input" placeholder="Mínimo de 8 caracteres"
                oninput="validarSenha(); confirmarSenha()" required>
            <button type="button" id="visualizar_senha" onclick="visualizarSenha()">👁</button>
            </div>
            
            <p id="msg_senha" class="msg-validacao"></p>
        </div>

        <div class="campo">
            <label for="ipt_conf_senha">Confirmar senha</label>
            <input type="password" id="ipt_conf_senha" class="form-input" placeholder="Repita sua senha"
                oninput="confirmarSenha()" required>
            <p id="msg_conf_senha" class="msg-validacao"></p>
        </div>


        <div class="campo">
            <label for="ipt_telefone">Telefone:</label>
            <input type="tel" id="ipt_telefone" class="form-input" placeholder="(11) 99999-9999"
                oninput="validarTelefone()">
        </div>

        <div>
            <button type="submit" class="button-cadastro">
                Cadastrar
            </button>
        </div>

        <div>
            <p class="form-text">
                Ao criar a conta, você concorda com os Termos de Uso e com o tratamento de dados previsto na LGPD.
            </p>
        </div>

    </form>

    <div class="text-login">
        <p>Já tem uma conta? <a href="#">Entrar</a></p>
    </div>

    <script>
        function validarNome() {
            let partes_nome = ipt_nome.value.trim().split(' ');
    
            if (ipt_nome.value.trim() == '') {
                msg_nome.innerHTML = ''
            } else {
                if (partes_nome.length < 2) {
                    msg_nome.innerHTML = `Digite seu nome e sobrenome`;
                    msg_nome.className = 'msg-validacao';
                } else {
                    msg_nome.innerHTML = `Nome válido!`;
                    msg_nome.className = 'msg-valida';
                }
            }
        }
    
        function validarEmail() {
            let email = ipt_email.value;
            if (ipt_email.value == '') {
                msg_email.innerHTML = '';
            } else {
                if (email.includes('@') && 
                    email.indexOf('@') == email.lastIndexOf('@') &&
                    email.lastIndexOf('@') != email.length - 1 &&
                    !email.startsWith('@')
                ) {
                    msg_email.innerHTML = `Email válido!`;
                    msg_email.className = 'msg-valida';
                } else {
                    msg_email.innerHTML = `O email deve possuir '@'`;
                    msg_email.className = 'msg-validacao'
                    
                }
            }
        }
    
        function validarSenha() {
            let senha = ipt_senha.value;
    
            if (senha.length >= 8 && /[A-Z]/.test(senha) && /[^A-Za-z0-9]/.test(senha)) {
                msg_senha.innerHTML = `Senha válida!`;
                msg_senha.className = "msg-valida";
            } else {
                msg_senha.innerHTML = `A senha deve conter no mínimo 8 caracteres, uma letra maiúscula e um caractere especial.`;
                msg_senha.className = 'msg-validacao';
            }
        }

        function visualizarSenha() {
            let tipo_senha = ipt_senha.type;

            if (tipo_senha == 'password') {
                ipt_senha.type = 'text'
            } else {
                ipt_senha.type = 'password'
            }
        }
    
        function confirmarSenha() {
            let senha = ipt_senha.value;
            let conf_senha = ipt_conf_senha.value;
    
            if (conf_senha == '') {
                msg_conf_senha.innerHTML = '';
            } else {
                if (senha === conf_senha) {
                    msg_conf_senha.innerHTML = `Senhas iguais!`;
                    msg_conf_senha.className = `msg-valida`;
                } else {
                    msg_conf_senha.innerHTML = `As senhas não coincidem`;
                    msg_conf_senha.className = `msg-validacao`;
                }
            }
        }
    
    
        function validarTelefone() {
            let telefone = ipt_telefone.value;
            telefone = telefone.replace(/\D/g, '');
            telefone = telefone.substring(0, 11);
    
            let parte1 = telefone.substring(0, 2);
            let parte2 = telefone.substring(2, 7);
            let parte3 = telefone.substring(7, 11);
    
            if (telefone.length <= 2) {
                ipt_telefone.value = telefone
            } else if (telefone.length <= 7) {
                ipt_telefone.value = '(' + parte1 + ')' + ' ' + parte2
            } else if (telefone.length <= 11) {
                ipt_telefone.value = '(' + parte1 + ')' + ' ' + parte2 + '-' + parte3
            }
        }
    
        function cadastrarUsuario(event) {
            event.preventDefault()

            let cadastro_valido = true;

            if (msg_nome.className == 'msg-validacao' ||
                msg_email.className == 'msg-validacao' ||
                msg_senha.className == 'msg-validacao' ||
                msg_conf_senha.className == 'msg-validacao' ||
                ipt_telefone.value.replace(/\D/g, '').length != 11
            ) {
                cadastro_valido = false;
            }

            if (cadastro_valido) {


                let dados_cadastro = {
                    nome: ipt_nome.value,
                    email: ipt_email.value,
                    telefone: ipt_telefone.value,
                }

                localStorage.setItem('dados_cadastro', JSON.stringify(dados_cadastro))
                console.log(localStorage.getItem('dados_cadastro'))

                alert('Cadastro validado!')
            } else {
                alert('Cadastro Incompleto!')
            }
        }
    </script>
</body>

</html>
